<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makhan Chor · Little Krishna Stories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(145deg, #fff8e7 0%, #ffe9d6 100%);
      color: #2e1b0e;
      line-height: 1.6;
      min-height: 100vh;
      padding: 1.5rem 1rem 4rem;
      position: relative;
      overflow-x: hidden;
    }

    .navbar {
      background: rgba(255, 245, 230, 0.95);
      backdrop-filter: blur(8px);
      padding: 0.8rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.5rem 1.5rem;
      border-bottom: 3px solid #f7c8a2;
      box-shadow: 0 6px 20px rgba(180, 100, 20, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      animation: navSlide 0.6s ease-out;
    }
    @keyframes navSlide {
      0%   { transform: translateY(-100%); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .nav-brand {
      font-family: 'Baloo 2', cursive;
      font-size: 1.7rem;
      font-weight: 800;
      color: #9b4b1f;
      text-shadow: 3px 3px 0 #ffe0b5;
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .nav-brand span { font-size: 1.5rem; animation: bounceIcon 2s infinite; }

    @keyframes bounceIcon {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-6px) rotate(8deg); }
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.8rem;
      align-items: center;
    }
    .nav-links a {
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      color: #6b3a1a;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      background: #fff2e2;
      border: 1.5px solid #f0c9a8;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav-links a:hover,
    .nav-links a.active {
      background: #ffdbb8;
      border-color: #d99b6c;
      color: #4a260a;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 6px 10px -4px rgba(180, 100, 20, 0.25);
    }
    .nav-links a.active {
      background: #f7b77a;
      border-color: #b15d1e;
      color: #2e1b0e;
      box-shadow: 0 6px 0 #b15d1e;
    }

    .bg-float {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      opacity: 0.07;
      animation: floatAround 14s ease-in-out infinite;
    }
    .bg-float:nth-child(1) { top: 8%; left: 3%; font-size: 6rem; animation-delay: 0s; }
    .bg-float:nth-child(2) { bottom: 10%; right: 5%; font-size: 9rem; animation-delay: 2s; }
    .bg-float:nth-child(3) { top: 55%; left: 8%; font-size: 5rem; animation-delay: 4s; }

    @keyframes floatAround {
      0%   { transform: translateY(0) rotate(0deg); }
      50%  { transform: translateY(-35px) rotate(10deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    .sparkle {
      position: fixed;
      width: 8px; height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      animation: sparkleAnim 3s ease-in-out infinite;
    }
    @keyframes sparkleAnim {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50%      { opacity: 0.9; transform: scale(1.3); }
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1.2rem 4rem;
      position: relative;
      z-index: 2;
    }

    .story-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: #fffef9;
      padding: 2.5rem 1.5rem 2rem;
      border-radius: 60px 60px 40px 40px;
      box-shadow: 0 20px 30px -10px rgba(120, 60, 20, 0.2), 0 0 0 3px #ffe3c2, 0 0 0 8px #fff9f0;
      margin-bottom: 2.5rem;
      border: 1px solid #f7d2b0;
      animation: heroEnter 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      position: relative;
      overflow: hidden;
    }
    .story-hero::before {
      content: "";
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(255, 200, 120, 0.15), transparent, rgba(255, 200, 120, 0.15), transparent);
      animation: rotateGlow 8s linear infinite;
      pointer-events: none;
    }
    @keyframes rotateGlow {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes heroEnter {
      0%   { opacity: 0; transform: scale(0.85) translateY(40px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .story-hero-illustration {
      font-size: 6rem;
      line-height: 1;
      margin-bottom: 1rem;
      letter-spacing: 12px;
      filter: drop-shadow(0 8px 12px rgba(180, 100, 20, 0.15));
      position: relative;
      z-index: 1;
    }
    .story-hero-illustration span {
      display: inline-block;
      animation: heroEmoji 2.5s ease-in-out infinite;
    }
    .story-hero-illustration span:nth-child(1) { animation-delay: 0s; }
    .story-hero-illustration span:nth-child(2) { animation-delay: 0.4s; }
    .story-hero-illustration span:nth-child(3) { animation-delay: 0.8s; }

    @keyframes heroEmoji {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      25%      { transform: translateY(-15px) rotate(12deg) scale(1.2); }
      75%      { transform: translateY(-8px) rotate(-10deg) scale(1.1); }
    }

    .story-hero h1 {
      font-family: 'Baloo 2', cursive;
      font-size: 2.8rem;
      font-weight: 800;
      color: #9b4b1f;
      text-shadow: 4px 4px 0 #ffe0b5;
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 1;
      animation: titleEnter 0.8s ease-out 0.2s both;
    }
    @keyframes titleEnter {
      0%   { opacity: 0; transform: translateX(-30px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .story-tagline {
      font-size: 1.15rem;
      font-weight: 600;
      color: #7b3f1a;
      background: #fdebd0;
      padding: 0.4rem 1.6rem;
      border-radius: 40px;
      display: inline-block;
      border: 1px dashed #d99b6c;
      margin-bottom: 1.5rem;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.8s ease-out 0.4s both;
    }
    @keyframes fadeInUp {
      0%   { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .narration-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.5rem;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.8s ease-out 0.6s both;
    }

    .btn-narrate {
      background: #ffb26e;
      border: none;
      border-radius: 60px;
      padding: 0.9rem 2rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: #321f0f;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 8px 0 #b15d1e, 0 8px 16px rgba(180, 100, 20, 0.3);
      transition: all 0.08s linear;
      border: 1px solid #fec28c;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }
    .btn-narrate::before {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.5s, height 0.5s;
    }
    .btn-narrate:hover::before { width: 300px; height: 300px; }
    .btn-narrate:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #b15d1e, 0 6px 12px rgba(180, 100, 20, 0.3);
    }
    .btn-narrate.stop-btn {
      background: #d99b6c;
      box-shadow: 0 8px 0 #8a4f26, 0 8px 16px rgba(180, 100, 20, 0.3);
      color: #fff6e0;
    }
    .btn-narrate:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: 0 4px 0 #7a441b;
      pointer-events: none;
    }

    .btn-icon {
      font-size: 1.4rem;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.1));
      position: relative;
      z-index: 1;
      animation: iconPulse 2s infinite;
    }
    @keyframes iconPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.2); }
    }

    .narration-status {
      font-size: 0.95rem;
      font-weight: 600;
      color: #a15824;
      background: #fff2e0;
      padding: 0.45rem 1.2rem;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: inset 0 0 0 1px #ffdbb8;
    }

    .status-dot {
      width: 10px; height: 10px;
      background: #b3b3b3;
      border-radius: 50%;
      display: inline-block;
      transition: background 0.2s;
    }
    .status-dot.active {
      background: #ff6b2b;
      box-shadow: 0 0 8px #ff8a4c;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%   { opacity: 1; transform: scale(1); }
      50%  { opacity: 0.7; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    .story-body {
      background: #fffef9;
      padding: 2rem 1.8rem 2.5rem;
      border-radius: 40px;
      box-shadow: 0 20px 30px -10px rgba(120, 60, 20, 0.15), 0 0 0 2px #ffe3c2, 0 0 0 6px #fff9f0;
      border: 1px solid #f7d2b0;
      font-size: 1.08rem;
      color: #3d2615;
      animation: bodyEnter 1s ease-out 0.3s both;
    }
    @keyframes bodyEnter {
      0%   { opacity: 0; transform: translateY(40px
